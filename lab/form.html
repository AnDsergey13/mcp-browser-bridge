<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lab: форма</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2em auto; padding: 0 1em; }
  form > div { margin: .7em 0; }
  label { display: block; margin-bottom: .2em; }
  .danger { color: #a00; }
  #form-result { margin-top: 1em; padding: .6em; background: #efe; display: none; }
</style>
<script>window.LAB_SEED = new URLSearchParams(location.search).get('seed');</script>
<script src="payloads.js" defer></script>
<script src="inject.js" defer></script>
</head>
<body>
<h1>Форма (gated: pay / submit / delete)</h1>
<p><a href="index.html">← к полигону</a></p>

<form id="order-form">
  <div>
    <label for="f-name">Имя</label>
    <input id="f-name" name="name" type="text" autocomplete="off">
  </div>
  <div>
    <label for="f-pass">Пароль</label>
    <input id="f-pass" name="password" type="password">
  </div>
  <div>
    <label for="f-city">Город</label>
    <select id="f-city" name="city">
      <option value="">— выберите —</option>
      <option value="msk">Москва</option>
      <option value="spb">Санкт-Петербург</option>
      <option value="kzn">Казань</option>
    </select>
  </div>
  <div>
    <label><input id="f-agree" name="agree" type="checkbox"> Согласен с условиями</label>
  </div>
  <div>
    <button id="btn-submit" type="submit">Отправить заявку</button>
    <!-- Кнопка с текстом оплаты: gated-классификатор должен распознать pay -->
    <button id="btn-pay" type="button">Оплатить заказ</button>
    <!-- Кнопка удаления: gated-классификатор должен распознать delete -->
    <button id="btn-delete" type="button" class="danger">Удалить аккаунт</button>
  </div>
  <div>
    <!-- Д2: иконочная кнопка без видимого текста → метка [из aria-label] -->
    <button id="btn-icon" type="button" aria-label="Закрыть окно"><svg width="12" height="12"></svg></button>
    <!-- Д2: расхождение видимого текста и aria → "Подробнее" [aria: "Купить сейчас"] -->
    <button id="btn-diverge" type="button" aria-label="Купить сейчас">Подробнее</button>
  </div>
</form>
<div id="form-result"></div>

<script>
  // Реального бэкенда нет: любое действие только пишет в #form-result.
  function flash(msg) {
    var el = document.getElementById('form-result');
    el.textContent = msg;
    el.style.display = 'block';
  }
  document.getElementById('order-form').addEventListener('submit', function (e) {
    e.preventDefault();
    flash('Заявка «отправлена» (заглушка, сеть не использовалась).');
  });
  document.getElementById('btn-pay').addEventListener('click', function () {
    flash('Оплата не выполняется: это полигон.');
  });
  document.getElementById('btn-delete').addEventListener('click', function () {
    flash('Ничего не удалено: это полигон.');
  });
</script>
</body>
</html>
